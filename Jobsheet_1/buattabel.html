<html>
    <head>
        <title>Membuat tabel</title>
    </head>
    <body>
        <table border="1" height="50%" width="100%" cellpadding="2" cellspacing="50">
            <tr>
                <td align="left" valign="top">
                    <font face="courier">ini baris pertama kolom pertama</font>
                </td>
                <td>ini baris pertama kolom kedua</td>
                <td>tambah 1 kolom</td>
                <td>tambah 1 kolom</td>
                <td>tambah 1 kolom</td>
            </tr>
            <tr>
                <td>ini juga tambah 1 kolom lagi</td>
                <td colspan="4">ini sekarang menjadi gabungan 3 kolom</td>
            </tr>
        </table>
    </body>
</html>
